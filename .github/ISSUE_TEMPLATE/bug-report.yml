name: Bug report
description: Something in Travel Log isn't working as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please don't include private details such as your locations, photos or email address.
        Security issues should be reported privately: see [SECURITY.md](https://github.com/oliverkuzio/travel-log/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where were you using it?
      options:
        - travel.kuzio.app in a browser
        - travel.kuzio.app as an installed app (PWA)
        - My own deployment or local development
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, OS and browser
      placeholder: e.g. iPhone 15, iOS 18, Safari
  - type: checkboxes
    id: offline
    attributes:
      label: Connection
      options:
        - label: This happened while offline, or with changes waiting to sync
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
